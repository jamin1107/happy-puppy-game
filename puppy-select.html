<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快乐小狗图片选择</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d1a;font-family:'PingFang SC',sans-serif;color:#fff;padding:20px;min-height:100vh;}
h1{text-align:center;font-size:24px;margin-bottom:8px;color:#ffd966;}
.subtitle{text-align:center;font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:30px;}
.ref-section{text-align:center;margin-bottom:30px;}
.ref-section img{max-width:200px;border-radius:12px;border:2px solid rgba(255,217,102,0.3);}
.ref-label{font-size:12px;color:rgba(255,255,255,0.4);margin-top:6px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:900px;margin:0 auto;}
.card{background:rgba(255,255,255,0.05);border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.1);transition:all 0.3s;cursor:pointer;}
.card:hover{border-color:#d97757;transform:translateY(-4px);box-shadow:0 8px 24px rgba(217,119,87,0.2);}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.card-body{padding:12px;}
.card-label{font-size:15px;font-weight:700;color:#ffd966;margin-bottom:4px;}
.card-desc{font-size:11px;color:rgba(255,255,255,0.5);line-height:1.5;}
</style>
</head>
<body>
<h1>快乐小狗图片选择</h1>
<p class="subtitle">按你发的照片特征生成，选择你最喜欢的一张，告诉我编号即可</p>

<div class="ref-section">
  <img src="file:///Users/yantu/.trae-cn/attachments/6a6c41bbdc5325d37b272c51/58df2c03-e342-43f1-a8de-0bb5708a6386_8c66f2b6-c0f2-4e8f-ba4e-0dad26826d48_9914dbbce336be80d3e8155a2b7226e4.png" alt="参考照片">
  <div class="ref-label">你发的小狗参考照片</div>
</div>

<div class="grid">
  <div class="card" onclick="alert('你选择了方案A')">
    <img src="assets/images/puppy_new1.jpg" alt="方案A">
    <div class="card-body">
      <div class="card-label">方案A</div>
      <div class="card-desc">站姿正面，草地花朵背景，开心友好</div>
    </div>
  </div>
  <div class="card" onclick="alert('你选择了方案B')">
    <img src="assets/images/puppy_new2.jpg" alt="方案B">
    <div class="card-body">
      <div class="card-label">方案B</div>
      <div class="card-desc">坐姿端正，公园树林背景，警觉友善</div>
    </div>
  </div>
  <div class="card" onclick="alert('你选择了方案C')">
    <img src="assets/images/puppy_new3.jpg" alt="方案C">
    <div class="card-body">
      <div class="card-label">方案C</div>
      <div class="card-desc">趴姿前伸，花园背景，放松开心</div>
    </div>
  </div>
  <div class="card" onclick="alert('你选择了方案D')">
    <img src="assets/images/puppy_new4.jpg" alt="方案D">
    <div class="card-body">
      <div class="card-label">方案D</div>
      <div class="card-desc">歪头站立，街道背景，好奇可爱</div>
    </div>
  </div>
</div>
</body>
</html>
