<script>
// ============================================================

// ============================================================

// Polyfill roundRect (must be before any draw calls)
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r === 'number') r = [r,r,r,r];
    else if(!Array.isArray(r)) r = [0,0,0,0];
    this.beginPath();
    this.moveTo(x+r[0], y);
    this.lineTo(x+w-r[1], y);
    this.quadraticCurveTo(x+w, y, x+w, y+r[1]);
    this.lineTo(x+w, y+h-r[2]);
    this.quadraticCurveTo(x+w, y+h, x+w-r[2], y+h);
    this.lineTo(x+r[3], y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r[3]);
    this.lineTo(x, y+r[0]);
    this.quadraticCurveTo(x, y, x+r[0], y);
    this.closePath();
    return this;
  };
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const CW = 800, CH = 600;
canvas.width = CW;
canvas.height = CH;

// ---- Resize ----
function resizeCanvas(){
  const wrapper = document.getElementById('gameWrapper');
  const ww = window.innerWidth, wh = window.innerHeight;
  const scale = Math.min(ww / CW, wh / CH);
  canvas.style.width = (CW * scale) + 'px';
  canvas.style.height = (CH * scale) + 'px';
  document.getElementById('uiLayer').style.width = (CW * scale) + 'px';
  document.getElementById('uiLayer').style.height = (CH * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================
//  GAME STATE
// ============================================================
const G = {
  state: 'title',
  scene: 'community',
  px: 400, py: 400,  // player position
  pdir: 'down',
  pspeed: 2.8,
  moving: false,
  animFrame: 0,
  animTimer: 0,
  time: 8.0,  // game hours
  timeSpeed: 0.00003,  // hours per ms (~8 min per day cycle)
  questStage: 0,
  /* 0: not started
     1: accepted from 老陈
     2: found community pawprints
     3: talked to 王阿姨
     4: investigated kindergarten
     5: found B1 clue
     6: found B2 clue
     7: talked to cat at night
     8: found puppy in SM mall
     9: returned puppy
     10: complete */

  inventory: {
    cigarettes: false,
    dogFood: false,
    catFood: false,
  },
  flags: {
    restPromptShown: false,
    catTalked: false,
    puppyFound: false,
    puzzleSolved: false,
    b2Unlocked: false,
    mallEastUnlocked: false,
    garageUnlocked: false,
    beachUnlocked: false,
    beachVisited: false,
    gatekeeperTalked: false,
  },
  dialogue: null,
  dlgIndex: 0,
  dlgChoices: null,
  dlgCallback: null,
  nearInteract: null,
  transitionTo: null,
  transitionTimer: 0,
  toastTimer: 0,
  bgOffset: 0,
};

// ============================================================
//  INPUT
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if(e.key === ' '){ e.preventDefault(); tryInteract(); }
  if(e.key === 'Escape'){ if(G.state==='questlog') closeQuestLog(); }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Touch joystick
let joyActive = false, joyDX = 0, joyDY = 0;
const joyBase = document.getElementById('joystickBase');
const joyKnob = document.getElementById('joystickKnob');

function handleJoyStart(e){
  joyActive = true;
  handleJoyMove(e);
}
function handleJoyMove(e){
  if(!joyActive) return;
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = touch.clientX - cx;
  let dy = touch.clientY - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const max = rect.width/2 - 10;
  if(dist > max){ dx = dx/dist*max; dy = dy/dist*max; }
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyDX = dx / max;
  joyDY = dy / max;
}
function handleJoyEnd(){
  joyActive = false;
  joyDX = 0; joyDY = 0;
  joyKnob.style.transform = 'translate(-50%, -50%)';
}
joyBase.addEventListener('touchstart', handleJoyStart, {passive:false});
joyBase.addEventListener('touchmove', handleJoyMove, {passive:false});
joyBase.addEventListener('touchend', handleJoyEnd);
joyBase.addEventListener('mousedown', handleJoyStart);
window.addEventListener('mousemove', handleJoyMove);
window.addEventListener('mouseup', handleJoyEnd);

document.getElementById('interactBtn').addEventListener('click', tryInteract);
document.getElementById('questBtn').addEventListener('click', () => {
  if(G.state === 'playing') openQuestLog();
});
document.getElementById('closeQuestBtn').addEventListener('click', closeQuestLog);
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', () => location.reload());
document.getElementById('restToNightBtn').addEventListener('click', () => { restToNight(); });
document.getElementById('restCancelBtn').addEventListener('click', () => { document.getElementById('restPrompt').classList.remove('show'); });

// Time skip buttons
document.querySelectorAll('.skip-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if(G.state !== 'playing') return;
    var h = parseInt(btn.getAttribute('data-hours'));
    skipHours(h);
  });
});

// Dialogue click to advance
document.getElementById('dialogueBox').addEventListener('click', (e) => {
  if(e.target.classList.contains('dlg-choice')) return;
  advanceDialogue();
});

// ============================================================

// ============================================================
const scenes = {

    objects: [

    ],
    exits: [
      {x:25,y:250,w:30,h:60,to:'teashop',label:'→ 茶叶店'},
      {x:CW-55,y:250,w:30,h:60,to:'delivery',label:'快递驿站 →'},
      {x:360,y:CH-30,w:80,h:30,to:'kindergarten',label:'↓ 幼儿园'},
      {x:25,y:400,w:30,h:60,to:'supermarket',label:'→ 超市'},
    ],
    playerStart: {x:400, y:350},
  },
  teashop: {
    name: '陈记茶叶店',
    obstacles: [
      {x:0,y:0,w:CW,h:30},
      {x:0,y:CH-30,w:CW,h:30},
      {x:0,y:0,w:25,h:CH},

// --- Player ---
function drawPlayer(ctx, x, y, dir, frame){
  ctx.save();
  ctx.translate(x, y);
  const bob = (G.moving && Math.floor(frame/8)%2) ? 1 : 0;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 22, 14, 5, 0, 0, Math.PI*2);
  ctx.fill();
  // body
  ctx.fillStyle = '#4a6fa5';
  ctx.beginPath();
  ctx.roundRect(-10, -5-bob, 20, 22, 4);
  ctx.fill();
  // head
  ctx.fillStyle = '#f4d4b0';
  ctx.beginPath();
  ctx.arc(0, -16-bob, 10, 0, Math.PI*2);
  ctx.fill();
  // hair
  ctx.fillStyle = '#3a5a8a';
  ctx.beginPath();
  ctx.arc(0, -20-bob, 9, Math.PI, 0);
  ctx.fill();
  // eyes
  ctx.fillStyle = '#333';
  if(dir === 'left'){
    ctx.beginPath(); ctx.arc(-5, -16-bob, 1.5, 0, Math.PI*2); ctx.fill();
  } else if(dir === 'right'){
    ctx.beginPath(); ctx.arc(5, -16-bob, 1.5, 0, Math.PI*2); ctx.fill();
  } else if(dir === 'up'){
    // no eyes when facing up
  } else {
    ctx.beginPath(); ctx.arc(-3, -16-bob, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -16-bob, 1.5, 0, Math.PI*2); ctx.fill();
  }
  // legs
  ctx.fillStyle = '#2a4a7a';
  const legOffset = (G.moving && Math.floor(frame/8)%2) ? 2 : 0;
  ctx.beginPath(); ctx.roundRect(-8, 15-bob, 6, 8+legOffset, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(2, 15-bob, 6, 8-legOffset, 2); ctx.fill();
  ctx.restore();
}

// --- Happy Puppy (金宝) - matching photo: cream/white body, golden ears, black nose ---
function drawPuppy(ctx, x, y, happy=true){
  ctx.save();
  ctx.translate(x, y);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 18, 6, 0, 0, Math.PI*2);
  ctx.fill();
  // body - cream/white
  ctx.fillStyle = '#f5ecd9';
  ctx.beginPath();
  ctx.ellipse(0, 5, 16, 12, 0, 0, Math.PI*2);
  ctx.fill();
  // back shading - slightly beige
  ctx.fillStyle = '#e8dcc4';
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 8, 0, Math.PI, 0);
  ctx.fill();
  // legs
  ctx.fillStyle = '#f5ecd9';
  ctx.beginPath(); ctx.roundRect(-12, 10, 6, 10, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(6, 10, 6, 10, 3); ctx.fill();
  // tail - wagging
  ctx.fillStyle = '#f5ecd9';
  const tailWag = happy ? Math.sin(Date.now()/200)*0.3 : 0;
  ctx.save();
  ctx.translate(14, 0);
  ctx.rotate(-0.5 + tailWag);
  ctx.beginPath();
  ctx.ellipse(0, -5, 4, 8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  // head
  ctx.fillStyle = '#f5ecd9';
  ctx.beginPath();
  ctx.arc(0, -10, 12, 0, Math.PI*2);
  ctx.fill();
  // ears - golden/tan
  ctx.fillStyle = '#d4a04c';
  ctx.beginPath();
  ctx.ellipse(-10, -12, 5, 9, -0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(10, -12, 5, 9, 0.3, 0, Math.PI*2);
  ctx.fill();
  // ear inner
  ctx.fillStyle = '#c08838';
  ctx.beginPath();
  ctx.ellipse(-10, -10, 3, 6, -0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(10, -10, 3, 6, 0.3, 0, Math.PI*2);
  ctx.fill();
  // muzzle area - lighter
  ctx.fillStyle = '#faf5e8';
  ctx.beginPath();
  ctx.ellipse(0, -7, 7, 6, 0, 0, Math.PI*2);
  ctx.fill();
  // nose - black
  ctx.fillStyle = '#2a2018';
  ctx.beginPath();
  ctx.ellipse(0, -10, 3, 2.5, 0, 0, Math.PI*2);
  ctx.fill();
  if(happy){
    // smiling mouth
    ctx.strokeStyle = '#2a2018';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(0, -5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-3, -5, 3, 0, Math.PI*0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(3, -5, 3, Math.PI*0.5, Math.PI);
    ctx.stroke();
    // tongue
    ctx.fillStyle = '#e8838a';
    ctx.beginPath();
    ctx.ellipse(0, -3, 2.5, 3, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // eyes
  ctx.fillStyle = '#2a2018';
  ctx.beginPath(); ctx.arc(-5, -14, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -14, 2, 0, Math.PI*2); ctx.fill();
  // eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-4.5, -14.5, 0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5, -14.5, 0.8, 0, Math.PI*2); ctx.fill();
  // collar
  ctx.strokeStyle = '#d97757';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -3, 10, Math.PI*0.2, Math.PI*0.8);
  ctx.stroke();
  // bell
  ctx.fillStyle = '#ffd966';
  ctx.beginPath();
  ctx.arc(0, 0, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// --- Black & White Cat (墨墨) - tuxedo cat ---
function drawCat(ctx, x, y, sad=true){
  ctx.save();
  ctx.translate(x, y);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 18, 14, 5, 0, 0, Math.PI*2);
  ctx.fill();
  // body - black
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.ellipse(0, 5, 13, 10, 0, 0, Math.PI*2);
  ctx.fill();
  // white chest patch
  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.ellipse(0, 8, 6, 7, 0, 0, Math.PI*2);
  ctx.fill();
  // legs
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath(); ctx.roundRect(-10, 10, 5, 8, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(5, 10, 5, 8, 2); ctx.fill();
  // white paws
  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath(); ctx.ellipse(-7, 18, 3.5, 2, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, 18, 3.5, 2, 0, 0, Math.PI*2); ctx.fill();
  // tail
  ctx.fillStyle = '#2a2a2a';
  ctx.save();
  ctx.translate(12, 2);
  ctx.rotate(sad ? 0.3 : -0.3);
  ctx.beginPath();
  ctx.ellipse(0, -4, 3, 10, 0, 0, Math.PI*2);
  ctx.fill();
  // white tail tip
  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.ellipse(0, -10, 3, 3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  // head - black
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.arc(0, -8, 10, 0, Math.PI*2);
  ctx.fill();
  // white face patch (muzzle area)
  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.ellipse(0, -5, 6, 5, 0, 0, Math.PI*2);
  ctx.fill();
  // ears
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.moveTo(-9, -14); ctx.lineTo(-5, -20); ctx.lineTo(-3, -14); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(9, -14); ctx.lineTo(5, -20); ctx.lineTo(3, -14); ctx.closePath(); ctx.fill();
  // inner ears
  ctx.fillStyle = '#d97757';
  ctx.beginPath();
  ctx.moveTo(-7, -15); ctx.lineTo(-5, -18); ctx.lineTo(-4, -15); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(7, -15); ctx.lineTo(5, -18); ctx.lineTo(4, -15); ctx.closePath(); ctx.fill();
  // eyes - green, droopy if sad
  ctx.fillStyle = '#5a9a5a';
  if(sad){
    // droopy/sad eyes
    ctx.beginPath(); ctx.ellipse(-4, -10, 2, 1.5, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, -10, 2, 1.5, 0.3, 0, Math.PI*2); ctx.fill();
    // sad eyebrows
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-6, -13); ctx.lineTo(-2, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -13); ctx.lineTo(2, -12); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-4, -10, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -10, 2, 0, Math.PI*2); ctx.fill();
  }
  // eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-3.5, -10.5, 0.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.5, -10.5, 0.7, 0, Math.PI*2); ctx.fill();
  // nose - pink
  ctx.fillStyle = '#d97757';
  ctx.beginPath();
  ctx.ellipse(0, -6, 1.5, 1, 0, 0, Math.PI*2);
  ctx.fill();
  // mouth - small
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(0, -5); ctx.lineTo(0, -3);
  ctx.stroke();
  if(sad){
    ctx.beginPath();
    ctx.arc(-2, -3, 2, 0, Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(2, -3, 2, 0, Math.PI);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(-2, -3, 2, Math.PI, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(2, -3, 2, Math.PI, Math.PI*2);
    ctx.stroke();
  }
  // whiskers
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(-12, -7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, -5); ctx.lineTo(-12, -4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(12, -7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, -5); ctx.lineTo(12, -4); ctx.stroke();
  ctx.restore();
}

function drawObstacle(ctx, obs){
  const t = obs.type || 'wall';
  switch(t){
    case 'building1':
    case 'building2':
      ctx.fillStyle = t==='building1' ? '#c9a87c' : '#b89878';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      for(let i=0;i<3;i++) for(let j=0;j<2;j++){
        ctx.fillRect(obs.x+10+i*45, obs.y+10+j*30, 25, 18);
      }
      ctx.fillStyle = '#8b7355';
      ctx.fillRect(obs.x, obs.y, obs.w, 4);
      break;
    case 'garden':
      ctx.fillStyle = '#7c9a6a';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      for(let i=0;i<6;i++){
        ctx.fillStyle = i%2 ? '#5a8a4a' : '#6a9a5a';
        ctx.beginPath(); ctx.arc(obs.x+15+i*20, obs.y+obs.h/2, 8, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'fountain':
      ctx.fillStyle = '#7ab8d4';
      ctx.beginPath(); ctx.ellipse(obs.x+obs.w/2, obs.y+obs.h/2, obs.w/2, obs.h/2, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5a9ac4';
      ctx.beginPath(); ctx.ellipse(obs.x+obs.w/2, obs.y+obs.h/2, obs.w/3, obs.h/3, 0, 0, Math.PI*2); ctx.fill();
      break;
    case 'shelf':
      ctx.fillStyle = '#8b6b4b';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#a0855a';
      ctx.fillRect(obs.x, obs.y, obs.w, 5);
      ctx.fillStyle = '#d4a04c';
      for(let i=0;i<3;i++) ctx.fillRect(obs.x+10+i*30, obs.y+10, 20, 15);
      break;
    case 'counter':
      ctx.fillStyle = '#6b5040';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#8b6b4b';
      ctx.fillRect(obs.x, obs.y, obs.w, 6);
      break;
    case 'building_kg':
      ctx.fillStyle = '#f4c87a';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#e8a85a';
      ctx.fillRect(obs.x, obs.y, obs.w, 6);
      ctx.fillStyle = '#fff';
      for(let i=0;i<2;i++) for(let j=0;j<2;j++)
        ctx.fillRect(obs.x+20+i*50, obs.y+25+j*25, 25, 15);
      break;
    case 'slide':
      ctx.fillStyle = '#e87a5a';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#c45a3a';
      ctx.fillRect(obs.x, obs.y+obs.h-8, obs.w, 8);
      break;
    case 'sandbox':
      ctx.fillStyle = '#e8d4a0';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.strokeStyle = '#c4a874'; ctx.lineWidth = 3;
      ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
      break;
    case 'car':
      ctx.fillStyle = '#5a7a9a';
      ctx.beginPath(); ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 8); ctx.fill();
      ctx.fillStyle = '#4a6a8a';
      ctx.beginPath(); ctx.roundRect(obs.x+15, obs.y+8, obs.w-30, obs.h-20, 4); ctx.fill();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.roundRect(obs.x+5, obs.y+obs.h-8, 15, 8, 2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(obs.x+obs.w-20, obs.y+obs.h-8, 15, 8, 2); ctx.fill();
      break;
    case 'pillar':
      ctx.fillStyle = '#666';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#777';
      ctx.fillRect(obs.x, obs.y, obs.w, 5);
      break;
    case 'shop':
      ctx.fillStyle = '#8a7a9a';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#a08aaa';
      ctx.fillRect(obs.x, obs.y, obs.w, 6);
      ctx.fillStyle = '#fff';
      ctx.fillRect(obs.x+15, obs.y+15, obs.w-30, obs.h-30);
      break;
    case 'beach_rock':
      ctx.fillStyle = '#8a8070';
      ctx.beginPath();
      ctx.ellipse(obs.x+obs.w/2, obs.y+obs.h/2, obs.w/2, obs.h/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#6a6050';
      ctx.beginPath();
      ctx.ellipse(obs.x+obs.w/2, obs.y+obs.h-10, obs.w/2.5, obs.h/3, 0, 0, Math.PI*2);
      ctx.fill();
      break;
    case 'beach_hut':
      ctx.fillStyle = '#d4a060';
      ctx.fillRect(obs.x, obs.y+15, obs.w, obs.h-15);
      ctx.fillStyle = '#c45a3a';
      ctx.beginPath();
      ctx.moveTo(obs.x-5, obs.y+15);
      ctx.lineTo(obs.x+obs.w/2, obs.y-5);
      ctx.lineTo(obs.x+obs.w+5, obs.y+15);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#8b6b4b';
      ctx.fillRect(obs.x+obs.w/2-15, obs.y+25, 30, obs.h-25);
      break;
    default:
      ctx.fillStyle = '#666';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
  }
}

function drawSceneBg(ctx, sceneName){
  const sc = scenes[sceneName];
  // Base ground
  const groundColors = {
    community: '#a8c878',
    teashop: '#d4b896',
    delivery: '#c4c4c4',
    kindergarten: '#b8d8a0',
    parking_b1: '#555560',
    parking_b2: '#444450',
    sm_mall: '#d4c4b4',
    supermarket: '#e8e0d4',
    beach: '#f0dca0',
  };
  ctx.fillStyle = groundColors[sceneName] || '#999';
  ctx.fillRect(0, 0, CW, CH);

  // Scene-specific ground details
  if(sceneName === 'community'){
    // path
    ctx.fillStyle = '#c4b896';
    ctx.fillRect(350, 0, 100, CH);
    ctx.fillRect(0, 340, CW, 60);
    // grass texture dots
    ctx.fillStyle = 'rgba(90,138,74,0.3)';
    for(let i=0;i<30;i++){
      ctx.beginPath(); ctx.arc(Math.random()*CW, Math.random()*CH, 3, 0, Math.PI*2); ctx.fill();
    }
  } else if(sceneName === 'teashop'){
    ctx.fillStyle = '#c4a878';
    ctx.fillRect(0, 0, CW, CH);
    // tea decorations on wall
  } else if(sceneName === 'delivery'){
    // floor lines
    ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1;
    for(let i=0;i<CW;i+=60){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,CH); ctx.stroke(); }
    for(let i=0;i<CH;i+=60){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(CW,i); ctx.stroke(); }
  } else if(sceneName === 'kindergarten'){
    // colorful ground
    ctx.fillStyle = 'rgba(232,122,90,0.1)';
    ctx.fillRect(300, 300, 200, 100);
    // rainbow path
    const colors = ['#e87a5a','#e8b85a','#7aba5a','#5a9ac4','#9a7aba'];
    for(let i=0;i<5;i++){
      ctx.fillStyle = colors[i];
      ctx.fillRect(360+i*8, 0, 8, 30);
    }
  } else if(sceneName === 'parking_b1' || sceneName === 'parking_b2'){
    // parking lines
    ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 2;
    for(let i=60;i<CW;i+=100){
      ctx.beginPath(); ctx.moveTo(i, 40); ctx.lineTo(i, 160); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(i, 420); ctx.lineTo(i, 540); ctx.stroke();
    }
    // B2 label
    if(sceneName === 'parking_b2'){
      ctx.fillStyle = 'rgba(255,217,102,0.3)';
      ctx.font = 'bold 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('B2', CW/2, CH/2);
      ctx.textAlign = 'left';
    }
  } else if(sceneName === 'sm_mall'){
    // shiny floor
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    for(let i=0;i<5;i++){
      ctx.fillRect(0, 100+i*90, CW, 2);
    }
  } else if(sceneName === 'supermarket'){
    // floor tiles
    ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1;
    for(let i=0;i<CW;i+=50){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,CH); ctx.stroke(); }
    for(let i=0;i<CH;i+=50){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(CW,i); ctx.stroke(); }
  } else if(sceneName === 'beach'){
    // sand texture
    ctx.fillStyle = 'rgba(200,170,100,0.3)';
    for(let i=0;i<40;i++){
      ctx.beginPath(); ctx.arc(Math.random()*CW, 150+Math.random()*(CH-180), 2+Math.random()*3, 0, Math.PI*2); ctx.fill();
    }
    // ocean at top
    const oceanGrad = ctx.createLinearGradient(0, 30, 0, 150);
    oceanGrad.addColorStop(0, '#4a9aca');
    oceanGrad.addColorStop(1, '#7ab8d4');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, 30, CW, 120);
    // waves
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      const wy = 60+i*25;
      for(let x=0;x<CW;x+=20){
        ctx.quadraticCurveTo(x+10, wy-5, x+20, wy);
      }
      ctx.stroke();
    }
    // 荻花 (reed grass) decoration
    ctx.strokeStyle = '#c4a44a'; ctx.lineWidth = 2;
    for(let i=0;i<15;i++){
      const gx = 50+i*50, gy = 150+Math.random()*30;
      ctx.beginPath(); ctx.moveTo(gx, gy+20); ctx.lineTo(gx-3, gy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx, gy+20); ctx.lineTo(gx+3, gy-5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx, gy+20); ctx.lineTo(gx, gy-8); ctx.stroke();
    }
  }

  // Draw obstacles
  sc.obstacles.forEach(obs => drawObstacle(ctx, obs));

  // Draw exits
  sc.exits.forEach(ex => {
    const locked = ex.locked && !isExitUnlocked(ex);
    if(locked){
      ctx.fillStyle = 'rgba(120,120,120,0.15)';
      ctx.fillRect(ex.x, ex.y, ex.w, ex.h);
      ctx.strokeStyle = 'rgba(180,180,180,0.4)';
    } else {
      ctx.fillStyle = 'rgba(217,119,87,0.2)';
      ctx.fillRect(ex.x, ex.y, ex.w, ex.h);
      ctx.strokeStyle = 'rgba(217,119,87,0.5)';
    }
    ctx.lineWidth = 2;
    ctx.setLineDash(locked ? [3,3] : [5,5]);
    ctx.strokeRect(ex.x, ex.y, ex.w, ex.h);
    ctx.setLineDash([]);
    // label
    ctx.fillStyle = locked ? 'rgba(180,180,180,0.7)' : 'rgba(217,119,87,0.9)';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    var labelText = ex.label + (locked ? ' 🔒' : '');
    const lx = ex.x + ex.w/2, ly = ex.y + ex.h/2;
    ctx.save();
    ctx.translate(lx, ly);
    if(ex.w < ex.h){
      ctx.rotate(-Math.PI/2);
      ctx.fillText(labelText, 0, 4);
    } else {
      ctx.fillText(labelText, 0, 4);
    }
    ctx.restore();
    ctx.textAlign = 'left';
  });
}

function isExitUnlocked(ex){
  if(ex.to === 'parking_b1' && ex.locked){
    return G.flags.garageUnlocked;
  }
  if(ex.to === 'beach' && ex.locked){
    return G.flags.beachUnlocked;
  }
  return true;
}

//  NIGHT OVERLAY
// ============================================================
function isNight(){
  return G.time >= 22 || G.time < 6;
}
function getTimeLabel(){
  const h = Math.floor(G.time);
  const m = Math.floor((G.time - h) * 60);
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function drawNightOverlay(ctx){
  if(G.time >= 20 && G.time < 22){
    const t = (G.time - 20) / 2;
    ctx.fillStyle = `rgba(20,20,60,${t*0.2})`;
    ctx.fillRect(0,0,CW,CH);
  } else if(isNight()){
    ctx.fillStyle = 'rgba(15,15,50,0.45)';
    ctx.fillRect(0,0,CW,CH);
    // street lights
    ctx.fillStyle = 'rgba(255,220,100,0.08)';
    ctx.beginPath(); ctx.arc(150, 100, 80, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(650, 100, 80, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(400, 500, 80, 0, Math.PI*2); ctx.fill();
  } else if(G.time >= 6 && G.time < 8){
    const t = (G.time - 6) / 2;
    ctx.fillStyle = `rgba(255,200,100,${(1-t)*0.1})`;
    ctx.fillRect(0,0,CW,CH);
  }
}

// ============================================================
//  DIALOGUE SYSTEM
// ============================================================
function startDialogue(name, avatar, lines, choices, callback){
  G.state = 'dialogue';
  G.dialogue = lines;
  G.dlgIndex = 0;
  G.dlgChoices = choices;
  G.dlgCallback = callback;
  document.getElementById('dlgName').textContent = name;
  document.getElementById('dlgAvatar').textContent = avatar;
  document.getElementById('dialogueBox').classList.add('show');
  document.getElementById('dlgNext').style.display = choices ? 'none' : 'block';
  renderDialogue();
}

function renderDialogue(){
  const box = document.getElementById('dlgText');
  const text = G.dialogue[G.dlgIndex];
  box.textContent = text;
  const choicesDiv = document.getElementById('dlgChoices');
  choicesDiv.innerHTML = '';
  if(G.dlgIndex === G.dialogue.length - 1 && G.dlgChoices){
    G.dlgChoices.forEach((ch, i) => {
      const btn = document.createElement('div');
      btn.className = 'dlg-choice touch-btn';
      btn.textContent = ch.text;
      btn.style.pointerEvents = 'auto';
      btn.onclick = (e) => {
        e.stopPropagation();
        endDialogue();
        if(ch.callback) ch.callback();
      };
      choicesDiv.appendChild(btn);
    });
    document.getElementById('dlgNext').style.display = 'none';
  } else {
    document.getElementById('dlgNext').style.display = 'block';
  }
}

function advanceDialogue(){
  if(G.state !== 'dialogue') return;
  if(G.dlgIndex < G.dialogue.length - 1){
    G.dlgIndex++;
    renderDialogue();
  } else if(!G.dlgChoices){
    endDialogue();
    if(G.dlgCallback) G.dlgCallback();
  }
}

function endDialogue(){
  G.state = 'playing';
  G.dialogue = null;

function interactPuzzle(){
  if(G.flags.puzzleSolved){
    startDialogue('旁白', '📦', ['货箱已经挪开了，路是通的。']);
    return;
  }
  if(G.questStage < 7){

    return;
  }
  // Simple puzzle: push boxes
  startDialogue('旁白', '📦', [
    '面前有三只货箱挡路，需要按正确顺序推开才能通过。',
    '提示：先推左边，再推右边，最后推中间。',
  ], null, () => {
    doBoxPuzzle();
  });
}

let puzzleState = {boxes:[true,true,true], step:0};
const PUZZLE_ORDER = [0, 2, 1]; // left, right, middle

function doBoxPuzzle(){
  G.state = 'dialogue';
  document.getElementById('dialogueBox').classList.add('show');
  G.dialogue = ['选择要推开的货箱：'];
  G.dlgIndex = 0;
  G.dlgChoices = null;
  document.getElementById('dlgName').textContent = '推箱子谜题';
  document.getElementById('dlgAvatar').textContent = '📦';
  document.getElementById('dlgNext').style.display = 'none';
  renderPuzzleChoices();
}

function renderPuzzleChoices(){
  const choicesDiv = document.getElementById('dlgChoices');
  choicesDiv.innerHTML = '';
  document.getElementById('dlgText').textContent = '选择要推开的货箱（已推开 ' + puzzleState.step + '/3）：';
  const labels = ['推开左边的货箱', '推开中间的货箱', '推开右边的货箱'];
  labels.forEach((label, i) => {
    const btn = document.createElement('div');
    btn.className = 'dlg-choice touch-btn';
    if(!puzzleState.boxes[i]){
      btn.textContent = label + '（已推开）';
      btn.style.opacity = '0.4';
      btn.style.pointerEvents = 'none';
    } else {
      btn.textContent = label;
      btn.style.pointerEvents = 'auto';
      btn.onclick = (e) => {
        e.stopPropagation();
        if(i === PUZZLE_ORDER[puzzleState.step]){
          puzzleState.boxes[i] = false;
          puzzleState.step++;
          showToast('推开了货箱 ' + puzzleState.step + '/3');
          if(puzzleState.step === 3){
            G.flags.puzzleSolved = true;
            G.state = 'playing';
            document.getElementById('dialogueBox').classList.remove('show');
            setTimeout(() => {
              startDialogue('旁白', '🎉', [
                '货箱全部推开！路通了！',
                '你快步走进仓库深处——',
                '金宝！它正蜷缩在角落里，看到你的一瞬间，尾巴疯狂地摇了起来！',
                '它扑到你身上，开心地舔你的脸。虽然脏兮兮的，但精神很好。',
              ], null, () => {
                G.questStage = 8;
                G.flags.puppyFound = true;
                showToast('找到金宝了！');
                updateQuestLog();
                setTimeout(() => {
                  startDialogue('旁白', '🐾', [
                    '你抱起金宝，它温顺地靠在你怀里。',
                    '该把它送回陈记茶叶店了，老陈一定急坏了。',
                  ], null, () => {
                    transitionToScene('teashop');
                  });
                }, 500);
              });
            }, 500);
          } else {
            renderPuzzleChoices();
          }
        } else {
          showToast('顺序不对，试试别的');
        }
      };
    }
    choicesDiv.appendChild(btn);
  });
}

];

function updateQuestLog(){
  // Quest log is dynamically rendered in openQuestLog(), this is a hook for future use
}

function openQuestLog(){
  G.state = 'questlog';
  const container = document.getElementById('questItems');
  container.innerHTML = '';
  questSteps.forEach((step, i) => {
    const done = isStepDone(i);
    const current = isStepCurrent(i);
    const isOptional = step.optional;
    const div = document.createElement('div');
    div.className = 'quest-item';
    let hintText = '';
    if(!done && current){
      hintText = '<div class="quest-hint">→ ' + step.hint + '</div>';
    }
    var checkIcon = done ? '✓' : (i+1);
    var textStyle = done ? 'done' : '';
    var checkStyle = done ? 'done' : '';
    if(isOptional && !done){
      checkIcon = '?';
      textStyle += '';
      checkStyle = '';
    }
    div.innerHTML = `
      <div class="quest-check ${checkStyle}">${checkIcon}</div>
      <div>
        <div class="quest-text ${textStyle}">${step.text}</div>
        ${hintText}
      </div>
    `;
    container.appendChild(div);
  });
  document.getElementById('questLog').classList.add('show');
}

function closeQuestLog(){
  G.state = 'playing';
  document.getElementById('questLog').classList.remove('show');
}

function isStepDone(i){
  switch(i){
    case 0: return G.questStage >= 1;
    case 1: return G.clues.has('pawprints');
    case 2: return G.clues.has('wang_seen') || G.clues.has('teacher_seen');
    case 3: return G.questStage >= 4;
    case 4: return G.inventory.cigarettes || G.flags.garageUnlocked;
    case 5: return G.flags.garageUnlocked;
    case 6: return G.clues.has('b1_fur');
    case 7: return G.clues.has('beach_visited');
    case 8: return G.clues.has('b2_exit');
    case 9: return G.flags.catTalked;
    case 10: return G.questStage >= 8;
    case 11: return G.questStage >= 10;
    default: return false;
  }
}

function isStepCurrent(i){
  // Skip optional steps when determining current step
  for(let j=0;j<questSteps.length;j++){
    if(questSteps[j].optional) continue;
    if(!isStepDone(j)) return j === i;
  }
  return false;
}

// ============================================================
//  GAME LOOP
// ============================================================
let lastTime = 0;
function gameLoop(timestamp){
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;

  if(G.state === 'playing'){
    update(dt);
  }
  if(G.state === 'playing' || G.state === 'dialogue'){
    render();
  }
  
  // Toast timer
  if(G.toastTimer > 0){
    G.toastTimer -= dt;
    if(G.toastTimer <= 0){
      document.getElementById('toast').classList.remove('show');
    }
  }

  requestAnimationFrame(gameLoop);
}

function update(dt){
  // Movement
  let dx = 0, dy = 0;
  if(keys['w'] || keys['arrowup']) { dy = -1; G.pdir = 'up'; }
  if(keys['s'] || keys['arrowdown']) { dy = 1; G.pdir = 'down'; }
  if(keys['a'] || keys['arrowleft']) { dx = -1; G.pdir = 'left'; }
  if(keys['d'] || keys['arrowright']) { dx = 1; G.pdir = 'right'; }
  // Touch joystick
  if(joyActive && (Math.abs(joyDX) > 0.2 || Math.abs(joyDY) > 0.2)){
    dx = joyDX; dy = joyDY;
    if(Math.abs(joyDX) > Math.abs(joyDY)){
      G.pdir = joyDX > 0 ? 'right' : 'left';
    } else {
      G.pdir = joyDY > 0 ? 'down' : 'up';
    }
  }

  if(dx !== 0 || dy !== 0){
    // Normalize
    const len = Math.sqrt(dx*dx + dy*dy);
    if(len > 1){ dx /= len; dy /= len; }
    const newX = G.px + dx * G.pspeed;
    const newY = G.py + dy * G.pspeed;
    // Collision check
    if(!checkCollision(newX, G.py)) G.px = newX;
    if(!checkCollision(G.px, newY)) G.py = newY;
    G.moving = true;
    G.animTimer += dt;
    if(G.animTimer > 60){ G.animFrame++; G.animTimer = 0; }
  } else {
    G.moving = false;
  }

  // Time progression
  G.time += G.timeSpeed * dt;
  if(G.time >= 24) G.time -= 24;
  document.getElementById('timeDisplay').textContent = getTimeLabel();

  // Check exits
  const sc = scenes[G.scene];
  for(const ex of sc.exits){
    if(G.px > ex.x && G.px < ex.x + ex.w && G.py > ex.y && G.py < ex.y + ex.h){
      // Check locked exits
      if(ex.locked && !isExitUnlocked(ex)){
        if(ex.to === 'parking_b1'){
          showToast('门卫大爷挡着路，需要给他买烟');
        } else if(ex.to === 'beach'){
          showToast('需要先找到车才能去荻花洲');
        } else {
          showToast('这条路还通不了');
        }
        G.px = sc.playerStart.x;
        G.py = sc.playerStart.y;
        return;
      }
      // Check for parking_b2 exit - only via object
      if(ex.to === 'parking_b2'){
        if(G.questStage < 5 && !G.flags.b2Unlocked){
          showToast('还需要更多线索才能继续往下');
          G.px = sc.playerStart.x;
          G.py = sc.playerStart.y;
          return;
        }
      }
      transitionToScene(ex.to);
      return;
    }
  }

  // Check interaction proximity
  G.nearInteract = null;
  for(const npc of sc.npcs){
    if(Math.abs(G.px - npc.x) < 50 && Math.abs(G.py - npc.y) < 50){
      G.nearInteract = npc.interact;
      showInteractPrompt(npc.name);
      break;
    }
  }
  if(!G.nearInteract){
    for(const obj of sc.objects){
      if(G.px > obj.x - 30 && G.px < obj.x + obj.w + 30 && 
         G.py > obj.y - 30 && G.py < obj.y + obj.h + 30){
        G.nearInteract = obj.interact;
        showInteractPrompt('');
        break;
      }
    }
  }
  if(!G.nearInteract){
    document.getElementById('interactPrompt').classList.remove('show');
  }
}

function showInteractPrompt(name){
  const prompt = document.getElementById('interactPrompt');
  prompt.textContent = name ? (name + ' · 按空格交互') : '按空格交互';
  prompt.classList.add('show');
}

function tryInteract(){
  if(G.state !== 'playing') return;
  if(G.nearInteract) G.nearInteract();
}

function checkCollision(x, y){
  const sc = scenes[G.scene];
  const pad = 14; // player radius
  for(const obs of sc.obstacles){
    if(x > obs.x - pad && x < obs.x + obs.w + pad && 
       y > obs.y - 5 && y < obs.y + obs.h + 10){
      return true;
    }
  }
  return false;
}

// ============================================================
//  RENDER
// ============================================================
function render(){
  ctx.clearRect(0, 0, CW, CH);
  drawSceneBg(ctx, G.scene);
  
  // Draw NPCs
  const sc = scenes[G.scene];
  for(const npc of sc.npcs){
    npc.draw(ctx, npc.x, npc.y);
    // Name tag
    if(Math.abs(G.px - npc.x) < 100 && Math.abs(G.py - npc.y) < 100){
      ctx.fillStyle = 'rgba(30,25,20,0.8)';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      const tw = ctx.measureText(npc.name).width + 10;
      ctx.beginPath();
      ctx.roundRect(npc.x - tw/2, npc.y - 35, tw, 16, 4);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(npc.name, npc.x, npc.y - 23);
      ctx.textAlign = 'left';
    }
  }
  
  // Draw NPC-like objects (station owner)
  for(const obj of sc.objects){
    if(obj.isNpcLike){
      obj.draw(ctx, obj.x, obj.y);
    }
    // Interaction indicator
    if(Math.abs(G.px - obj.x - obj.w/2) < 50 && Math.abs(G.py - obj.y - obj.h/2) < 50){
      ctx.fillStyle = 'rgba(217,119,87,0.9)';
      ctx.beginPath();
      ctx.arc(obj.x + obj.w/2, obj.y - 5, 4 + Math.sin(Date.now()/200)*1, 0, Math.PI*2);
      ctx.fill();
    }
  }
  
  // Draw cat at night in delivery station
  if(G.scene === 'delivery' && isNight()){
    const catX = 600, catY = 130;
    drawCat(ctx, catX, catY, !G.flags.catTalked);
    // Interaction indicator
    if(Math.abs(G.px - catX) < 60 && Math.abs(G.py - catY) < 60){
      ctx.fillStyle = 'rgba(124,154,138,0.9)';
      ctx.beginPath();
      ctx.arc(catX, catY - 25, 4 + Math.sin(Date.now()/200)*1, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(30,25,20,0.8)';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.beginPath();
      ctx.roundRect(catX - 40, catY - 42, 80, 16, 4);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText('黑白小猫·墨墨', catX, catY - 30);
      ctx.textAlign = 'left';
    }
  }
  
  // Draw puppy in SM mall after puzzle solved
  if(G.scene === 'sm_mall' && G.flags.puzzleSolved && G.questStage < 8){
    // Already handled by dialogue
  }
  if(G.scene === 'sm_mall' && G.flags.puzzleSolved && G.questStage >= 8 && !G.flags.puppyFound){
    // Puppy is found
  }
  
  // Draw puppy in tea shop when quest complete
  if(G.scene === 'teashop' && G.questStage >= 10){
    drawPuppy(ctx, 350, 200, true);
  }
  
  // Draw player
  drawPlayer(ctx, G.px, G.py, G.pdir, G.animFrame);
  
  // Night overlay
  drawNightOverlay(ctx);
  
  // Interaction prompt on canvas (above player)
  if(G.nearInteract && G.state === 'playing'){
    ctx.fillStyle = 'rgba(217,119,87,0.9)';
    ctx.beginPath();
    ctx.arc(G.px, G.py - 35, 4 + Math.sin(Date.now()/200)*1, 0, Math.PI*2);
    ctx.fill();
  }
}

// ============================================================
//  TITLE SCREEN BACKGROUND
// ============================================================
function drawTitleBg(){
  const tc = document.getElementById('titleBgCanvas');
  const tctx = tc.getContext('2d');
  tctx.fillStyle = '#2a1f3e';
  tctx.fillRect(0,0,800,600);
  // Stars
  for(let i=0;i<50;i++){
    const x = (i*73)%800, y = (i*47)%300;
    tctx.fillStyle = `rgba(255,255,255,${0.3+Math.sin(i)*0.2})`;
    tctx.beginPath(); tctx.arc(x,y,1.5,0,Math.PI*2); tctx.fill();
  }
  // Moon
  tctx.fillStyle = '#ffd966';
  tctx.beginPath(); tctx.arc(650, 100, 40, 0, Math.PI*2); tctx.fill();
  tctx.fillStyle = '#2a1f3e';
  tctx.beginPath(); tctx.arc(635, 90, 35, 0, Math.PI*2); tctx.fill();
  // Ground
  tctx.fillStyle = '#3d2b1f';
  tctx.fillRect(0, 400, 800, 200);
  // Buildings silhouette
  tctx.fillStyle = '#1a1020';
  for(let i=0;i<8;i++){
    const x = i*100, h = 80+Math.sin(i)*30;
    tctx.fillRect(x, 400-h, 90, h);
  }
  // Draw puppy silhouette
  drawPuppy(tctx, 400, 480, true);
  // Draw cat silhouette
  drawCat(tctx, 320, 490, true);
}
drawTitleBg();

// ============================================================
//  START
// ============================================================
requestAnimationFrame(gameLoop);
</script>
